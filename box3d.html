<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Box with Drawer</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Thêm thư viện Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>

  <script>
    // Tạo scene, camera, renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Vật liệu
    const boxMaterial = new THREE.MeshLambertMaterial({ color: 0x4b2e1e }); // màu nâu
    const lidMaterial = new THREE.MeshLambertMaterial({ color: 0x8b0000 }); // màu đỏ đậm

    // Ngăn chính
    const mainBoxGeometry = new THREE.BoxGeometry(6, 2, 6);
    const mainBox = new THREE.Mesh(mainBoxGeometry, boxMaterial);
    mainBox.position.y = 1;
    scene.add(mainBox);

    // Ngăn kéo
    const drawerGeometry = new THREE.BoxGeometry(6, 1.5, 6);
    const drawer = new THREE.Mesh(drawerGeometry, boxMaterial);
    drawer.position.set(0, 0.25, 3.5); // Dịch ra phía trước
    scene.add(drawer);

    // Nắp hộp
    const lidGeometry = new THREE.BoxGeometry(6, 0.2, 6);
    const lid = new THREE.Mesh(lidGeometry, lidMaterial);
    lid.position.set(0, 2.1, -3);
    lid.rotation.x = -Math.PI / 4; // Gập nắp lên
    scene.add(lid);

    // Ánh sáng
    const light = new THREE.PointLight(0xffffff, 1);
    light.position.set(10, 10, 10);
    scene.add(light);

    // Camera
    camera.position.set(10, 8, 12);
    camera.lookAt(0, 1, 0);

    // Resize màn hình
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Vòng lặp render
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
